name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  EXPO_NO_TELEMETRY: 1

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate source
        run: npm run validate

  bundle:
    name: Export bundles
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Export production bundles
        run: npm run export
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: expo-bundles-${{ github.sha }}
          path: dist
          retention-days: 7
